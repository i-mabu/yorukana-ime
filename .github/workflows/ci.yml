name: CI

# 軽量 CI: 単一ジョブで単体テストと手動ビルド (build-apk.sh) を実行し、APK を検証する。
# Compose 依存 (libs/) は build-apk.sh が tools/resolve.py で自動取得する。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler 2.0.21
        run: |
          curl -fsSL -o /tmp/kotlin-compiler-2.0.21.zip "https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip"
          echo "0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  /tmp/kotlin-compiler-2.0.21.zip" | sha256sum -c -
          unzip -q /tmp/kotlin-compiler-2.0.21.zip -d /tmp
          echo "KOTLIN_HOME=/tmp/kotlinc" >> "$GITHUB_ENV"
      - name: Run unit tests (pure logic, no network)
        run: |
          chmod +x tests/run-tests.sh build-apk.sh build.sh
          ./tests/run-tests.sh
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK (manual pipeline, deps auto-resolved)
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME" SKIP_TESTS=1 ./build-apk.sh
      - name: Verify APK
        run: |
          set -o pipefail
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/yorukana.apk)"
          echo "$BADGING" | head -5
          echo "$BADGING" | grep -q "package: name='jp.yorukana.ime'"
          echo "$BADGING" | grep -q "versionCode='1'"
          echo "$BADGING" | grep -q "versionName='1.0.0'"
          echo "$BADGING" | grep -q "android.permission.VIBRATE"
          if echo "$BADGING" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission must not be present" >&2; exit 1
          fi
          unzip -l dist/yorukana.apk | grep -q "classes.dex"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/yorukana.apk
