name: CI

# 軽量CI: 単一ジョブで単体テストとオフライン手動ビルド (build-apk.sh) を実行し、APKを検証する。
# main への push / PR で実行し、ドキュメントだけの変更では実行しない。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin compiler 2.4.21
        run: |
          curl -sL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip
          unzip -q /tmp/kotlin-compiler.zip -d "$RUNNER_TEMP/kotlin"
          echo "KOTLIN_HOME=$RUNNER_TEMP/kotlin/kotlinc" >> "$GITHUB_ENV"
      - name: Run unit tests (pure logic, no network)
        run: |
          chmod +x tests/run-tests.sh build-apk.sh
          ./tests/run-tests.sh
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK (offline manual pipeline)
        run: |
          ANDROID_SDK_ROOT="$ANDROID_HOME" ./build-apk.sh
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/yorukana.apk | head -5
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/yorukana.apk
